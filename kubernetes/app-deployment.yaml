apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingwatch
  namespace: pingwatch
  labels:
    app: pingwatch
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pingwatch

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: pingwatch
        version: v1
    spec:
      containers:
      - name: pingwatch
        image: pingwatch:latest
        imagePullPolicy: Never   # use local Minikube image
        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/pingwatch"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: pingwatch-config
              key: DB_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pingwatch-secret
              key: db-password
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: pingwatch-service
  namespace: pingwatch
spec:
  selector:
    app: pingwatch
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort